<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Familiars</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --border:#e6e1d7; --text:#2b2b2b; --muted:#8a857d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 16px; background:var(--card); border-bottom:1px solid var(--border); }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .top h1 { margin:0; font-size:18px; }
  #clear { border:1px solid var(--border); background:#fff; border-radius:8px; padding:6px 12px; cursor:pointer; font-size:13px; color:var(--muted); }
  #clear:hover { color:var(--text); border-color:var(--text); }
  #mentions { display:flex; gap:8px; flex-wrap:wrap; }
  .mention { border:1px solid var(--border); background:#fff; border-radius:999px; padding:6px 12px; cursor:pointer; font-size:14px; }
  .mention:hover { border-color:var(--text); }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:72%; padding:10px 12px; border-radius:12px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .user { align-self:flex-end; background:#2b2b2b; color:#fff; border-bottom-right-radius:4px; }
  .agent { align-self:flex-start; background:var(--card); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .agent .who { font-size:12px; color:var(--muted); margin-bottom:4px; }
  footer { padding:12px 16px; background:var(--card); border-top:1px solid var(--border); display:flex; gap:8px; }
  #input { flex:1; padding:10px; border:1px solid var(--border); border-radius:8px; font-size:14px; }
  #send { padding:10px 16px; border:none; background:#2b2b2b; color:#fff; border-radius:8px; cursor:pointer; font-size:14px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>🦁 Familiars</h1>
    <button id="clear">清空记录</button>
  </div>
  <div id="mentions"></div>
</header>
<main id="log"></main>
<footer>
  <input id="input" placeholder="输入问题；@名字 单独问，不 @ 则三个一起答">
  <button id="send">发送</button>
</footer>
<script>
  const EMOJI = { deepseek: '🐱', glm: '🦊', kimi: '🦉' };
  const state = { members: [] };
  const log = document.getElementById('log');
  const input = document.getElementById('input');

  function renderMentions() {
    const el = document.getElementById('mentions');
    el.innerHTML = '';
    for (const m of state.members) {
      const b = document.createElement('button');
      b.className = 'mention';
      b.textContent = (EMOJI[m.id] ?? '🐾') + ' ' + m.name;
      b.title = '点一下插入 @' + m.name;
      b.onclick = () => {
        input.value = (input.value.trim() ? input.value.trim() + ' ' : '') + '@' + m.name + ' ';
        input.focus();
      };
      el.appendChild(b);
    }
  }

  // 解析消息里的 @ 提及，返回被 @ 的成员（按名字/别名匹配）。
  function parseMentions(prompt) {
    const out = [];
    for (const m of state.members) {
      const names = [m.name, ...m.aliases];
      if (names.some((n) => prompt.includes('@' + n))) out.push(m);
    }
    return out;
  }

  function scrollBottom() { log.scrollTop = log.scrollHeight; }

  function addUser(text, target) {
    const d = document.createElement('div');
    d.className = 'msg user';
    d.textContent = (target === '@all' ? '📢 ' : '') + text;
    log.appendChild(d);
    scrollBottom();
  }

  function addAgentBubble(m) {
    const d = document.createElement('div');
    d.className = 'msg agent';
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = (EMOJI[m.id] ?? '🐾') + ' ' + m.name + ' · ' + m.animal + ' …';
    const body = document.createElement('div');
    d.appendChild(who);
    d.appendChild(body);
    log.appendChild(d);
    scrollBottom();
    return { who, body, text: '', name: m.name, animal: m.animal };
  }

  function renderHistory(msgs) {
    for (const m of msgs) {
      if (m.role === 'user') {
        addUser(m.text, m.target);
      } else if (m.role === 'agent') {
        const b = addAgentBubble({ id: m.member, name: m.name, animal: m.animal });
        b.text = m.text;
        b.body.textContent = m.text;
        b.who.textContent = (EMOJI[m.member] ?? '🐾') + ' ' + m.name + ' · ' + m.animal + ' ✓';
      }
    }
    scrollBottom();
  }

  async function send() {
    const prompt = input.value.trim();
    if (!prompt) return;
    input.value = '';

    const mentioned = parseMentions(prompt);
    const targets = mentioned.length > 0 ? mentioned : state.members;
    const broadcast = mentioned.length === 0;
    const targetLabel = broadcast ? '@all' : mentioned.map((m) => '@' + m.name).join(' ');

    addUser(prompt, targetLabel);

    const bubbles = {};
    for (const m of targets) bubbles[m.id] = addAgentBubble(m);

    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ members: targets.map((m) => m.id), prompt }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        if (!line) continue;
        const evt = JSON.parse(line);
        const b = evt.member ? bubbles[evt.member] : undefined;
        if (evt.text !== undefined && b) {
          b.text += evt.text;
          b.body.textContent = b.text;
        } else if (evt.done && b) {
          b.who.textContent = (EMOJI[evt.member] ?? '🐾') + ' ' + b.name + ' · ' + b.animal + ' ✓';
        } else if (evt.error) {
          if (b) b.body.textContent = '⚠️ ' + evt.error;
          else { const d = document.createElement('div'); d.className = 'msg agent'; d.textContent = '⚠️ ' + evt.error; log.appendChild(d); }
        }
        scrollBottom();
      }
    }
  }

  async function clearHistory() {
    if (!confirm('清空所有聊天记录？')) return;
    await fetch('/history', { method: 'DELETE' });
    log.innerHTML = '';
  }

  document.getElementById('send').onclick = send;
  document.getElementById('clear').onclick = clearHistory;
  input.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };

  (async function init() {
    state.members = await (await fetch('/members')).json();
    renderMentions();
    const msgs = await (await fetch('/history')).json();
    renderHistory(msgs);
  })();
</script>
</body>
</html>
